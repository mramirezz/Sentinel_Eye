# Configuration file for Sentinel Eye

video:
  input_path: data/
  output_path: outputs/
  target_resolution: [640, 480]
  frame_skip: 2  # Process every N frames

qc_score:
  weights:
    sharpness: 0.25
    occlusion: 0.25
    lighting: 0.25
    cleanliness: 0.25  
  thresholds:
    excellent: 80
    good: 60
    warning: 40
  hyperparameters:
    # Sharpness sensitivity: variance divisor (higher = more strict)
    sharpness_divisor: 6.0  # Balanced (was 8.0 strict, 5.0 lenient)
    
    # Occlusion detection: minimum edge density threshold
    min_edge_density: 0.03  # Balanced (was 0.04 strict, 0.02 lenient)
    edge_density_multiplier: 1500  # Smoother gradient (was 500)
   
    # Lighting: ideal brightness center and tolerance
    ideal_brightness: 120  # Center of ideal range (0-255)
    brightness_divisor: 1.0  # More tolerant (was 0.8 strict)
    contrast_multiplier: 1.8  # Balanced (was 1.6)
    
    # Cleanliness: dust/rain detection sensitivity
    spot_threshold: 14  # More sensitive to detect rain/dust
    spot_penalty_multiplier: 900  # Harsher penalty for spots

stability:
  history_size: 30
  vibration_threshold: 0.8  # More sensitive to detect minor vibrations
  enable_self_healing: true
  initial_roi_file: initial_rois.json  # File with initial ROIs per video

optimization:
  use_gpu: true
  enable_resize: true  # Downscale to target_resolution for faster processing (loses quality)

# Detection settings (Module 3)
detection:
  use_yolo: true
  yolo_model: l  # Model size: 'n' (nano), 's' (small), 'm' (medium), 'l' (large), 'x' (xlarge)
  yolo_imgsz: 640  # YOLO input size (must be multiple of 32: 640, 1024, 1280)
  confidence_threshold: 0.5  # YOLO confidence threshold (0.0-1.0)
  show_yolo: true

logging:
  level: INFO
  save_plots: true
  save_videos: true

roi:
  default: [100, 100, 440, 280]  # x, y, w, h
  enable_adaptive: true
