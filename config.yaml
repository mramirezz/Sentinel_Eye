# Configuration file for Sentinel Eye

video:
  input_path: data/
  output_path: outputs/
  target_resolution: [640, 480]
  frame_skip: 2  # Process every N frames

qc_score:
  weights:
    sharpness: 0.35
    occlusion: 0.25
    lighting: 0.20
    cleanliness: 0.20
  thresholds:
    excellent: 80
    good: 60
    warning: 40

stability:
  history_size: 30
  vibration_threshold: 0.8  # Más sensible para detectar vibraciones menores
  enable_self_healing: true
  initial_roi_file: initial_rois.json  # Archivo con ROIs iniciales por video

optimization:
  use_gpu: true
  batch_size: 1
  enable_tensorrt: false
  enable_onnx: false
  enable_resize: true  # Downscale to target_resolution for faster processing (loses quality)

# Detection settings (Module 3)
detection:
  use_yolo: true
  yolo_model: l  # Model size: 'n' (nano), 's' (small), 'm' (medium), 'l' (large), 'x' (xlarge)
  yolo_imgsz: 640  # YOLO input size (must be multiple of 32: 640, 1024, 1280)
  confidence_threshold: 0.5  # YOLO confidence threshold (0.0-1.0)
  show_yolo: true

logging:
  level: INFO
  save_plots: true
  save_videos: true

roi:
  default: [100, 100, 440, 280]  # x, y, w, h
  enable_adaptive: true
